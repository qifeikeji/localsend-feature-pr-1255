name: Build macOS arm64

# Artifacts from this workflow are arm64 only (Apple Silicon).

on:
  push:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.22.3"

jobs:
  build:
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: "stable"
          cache: false

      - name: Get version
        id: version
        working-directory: app
        run: |
          VERSION=$(sed -n 's/^version: \([0-9]*\.[0-9]*\.[0-9]*\).*/\1/p' pubspec.yaml)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Dependencies
        working-directory: app
        run: flutter pub get

      - name: CocoaPods
        working-directory: app/macos
        run: |
          rm -rf Pods Podfile.lock
          pod install

      - name: arm64-only + ad-hoc signing (CI)
        run: |
          bash scripts/ci/macos_adhoc_sign.sh
          bash scripts/ci/macos_arm64_only.sh

      - name: Clean macOS build
        working-directory: app
        run: flutter clean

      - name: Compile macOS (arm64)
        working-directory: app
        env:
          ARCHS: arm64
          EXCLUDED_ARCHS: x86_64
          ONLY_ACTIVE_ARCH: YES
          CODE_SIGN_IDENTITY: "-"
          CODE_SIGNING_ALLOWED: "NO"
          CODE_SIGNING_REQUIRED: "NO"
        run: flutter build macos --release

      - name: Create DMG
        working-directory: app
        run: |
          DMG="LocalSend-${{ steps.version.outputs.version }}-macos-arm64.dmg"
          bash ../scripts/ci/create_macos_dmg.sh \
            build/macos/Build/Products/Release/LocalSend.app \
            "$DMG"
          echo "DMG_NAME=$DMG" >> $GITHUB_ENV

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: app/${{ env.DMG_NAME }}
